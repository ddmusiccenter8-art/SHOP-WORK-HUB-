<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Hub | Admin Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e50000">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary: #e50000;
            --primary-hover: #cc0000;
            --bg-color: #fffdf0; /* Light yellow / cream background */
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --danger: #ef4444;
            --accent-purple: #c084fc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Noto Sans Sinhala', sans-serif; }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        .tabs { 
            margin-top: 0; 
            display: flex; 
            gap: 0.6rem; 
            width: 100%; 
            max-width: 1400px; 
            padding: 0 1.5rem; 
            flex-wrap: wrap;
        }

        .tab {
            padding: 0.6rem 1.2rem;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px 10px 0 0;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
            border-bottom: none;
            color: var(--text-muted);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }

        .tab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        .tab.active { 
            background: var(--card-bg); 
            color: var(--text-main); 
            border-top: 3px solid var(--primary); 
            box-shadow: 0 -4px 15px rgba(229, 0, 0, 0.15);
        }

        .container {
            width: 100%;
            max-width: 1400px;
            padding: 1.2rem;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
                grid.appendChild(card);
            });
        }

        window.openAddShopModal = function() {
            document.getElementById('addShopModal').style.display = 'flex';
        };

        window.closeAddShopModal = function() {
            document.getElementById('addShopModal').style.display = 'none';
        };

        document.getElementById('addShopForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveShopBtn');
            btn.disabled = true;
            btn.innerText = 'Registering...';

            const name = document.getElementById('newShopName').value.trim();
            const email = document.getElementById('newShopEmail').value.trim().toLowerCase();
            const phone = document.getElementById('newShopPhone').value.trim();
            const location = document.getElementById('newShopLocation').value.trim();

            addDoc(collection(db, "registered_shops"), {
                name: name,
                email: email,
                phone: phone,
                location: location,
                timestamp: Date.now()
            }).then(() => {
                showToast(`Shop ${name} registered successfully!`, "success");
                document.getElementById('addShopForm').reset();
                closeAddShopModal();
            }).catch(err => {
                showToast("Failed to register shop: " + err.message, "error");
            }).finally(() => {
                btn.disabled = false;
                btn.innerText = 'Register Shop';
            });
        });

        window.viewShopProfile = function(shopEmail, shopSales) {
            document.getElementById('shopListSection').style.display = 'none';
            document.getElementById('singleShopSection').style.display = 'block';
            document.getElementById('profileTitle').innerText = shopEmail.toUpperCase() + ' Profile & History';

            let totalMrp = 0;
            let totalLoan = 0;
            let totalPaid = 0;
            let totalPending = 0;

            const salesByDate = {};
            shopSales.forEach(s => {
                const mrp = parseFloat(s.mrp) || 0;
                const loan = parseFloat(s.loanAmount) || 0;
                const set = parseFloat(s.settlement) || 0;

                totalMrp += mrp;
                totalLoan += loan;
                if (s.paymentStatus === 'Paid') {
                    totalPaid += set;
                } else {
                    totalPending += set;
                }

                if (s.date) salesByDate[s.date] = (salesByDate[s.date] || 0) + loan;
            });

            document.getElementById('shopTotalMrp').innerText = 'Rs. ' + totalMrp.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('shopTotalLoan').innerText = 'Rs. ' + totalLoan.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('shopTotalPaid').innerText = 'Rs. ' + totalPaid.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('shopTotalPending').innerText = 'Rs. ' + totalPending.toLocaleString(undefined, {minimumFractionDigits: 2});

            const dates = Object.keys(salesByDate).sort();
            const amounts = dates.map(d => salesByDate[d]);

            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(document.getElementById('shopChart'), {
                type: 'bar',
                data: {
                    labels: dates,
                    datasets: [{ label: 'Daily Loan Volume (Rs.)', data: amounts, backgroundColor: '#e50000', borderRadius: 6 }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const tbody = document.getElementById('singleShopTable');
            tbody.innerHTML = '';
            shopSales.forEach(data => {
                const tr = document.createElement('tr');
                tr.onclick = () => openDetailsModal(data);
                let sourceHtml = data.stockSource === 'HO' ? '<span style="color:var(--success); font-size:0.8rem; font-weight:bold;">HO Stock (4% Profit)</span>' : '<span style="color:var(--text-muted); font-size:0.8rem;">Shop Stock (4% Discount)</span>';
                
                tr.innerHTML = `
                    <td>${data.date}</td>
                    <td><strong>${data.name}</strong><br><span style="color:var(--text-muted)">${data.model}</span></td>
                    <td>${sourceHtml}</td>
                    <td>Rs. ${parseFloat(data.loanAmount || 0).toLocaleString()}</td>
                    <td>${getStatusBadge(data.status)}</td>
                `;
                tbody.appendChild(tr);
            });
        };

        window.backToShops = function() {
            document.getElementById('singleShopSection').style.display = 'none';
            document.getElementById('shopListSection').style.display = 'block';
        };

        // Details Modal
        window.openDetailsModal = function(data) {
            currentModalDocId = data.id;
            const content = document.getElementById('modalContent');
            let sourceHtml = data.stockSource === 'HO' 
                ? '<span style="color:var(--success); font-weight:600;">Head Office Stock (4% Profit Settlement)</span>' 
                : '<span style="color:var(--text-muted);">Shop Own Stock (4% Discount Settlement)</span>';
            
            content.innerHTML = `
                <div class="detail-item"><strong>Date:</strong> <span class="val">${data.date || '-'}</span></div>
                <div class="detail-item"><strong>Shop:</strong> <span class="val">${data.shopId || '-'}</span></div>
                <div class="detail-item"><strong>Customer Name:</strong> <span class="val">${data.name || '-'}</span></div>
                <div class="detail-item"><strong>Customer NIC:</strong> <span class="val">${data.nic || '-'}</span></div>
                <div class="detail-item"><strong>Phone Model & Storage:</strong> <span class="val">${data.model || '-'} ${data.storage ? ' ('+data.storage+')' : ''}</span></div>
                <div class="detail-item"><strong>IMEI Number:</strong> <span class="val">${data.imei || '-'}</span></div>
                <div class="detail-item"><strong>Stock Source:</strong> <span class="val">${sourceHtml}</span></div>
                <div class="detail-item"><strong>SP Number:</strong> <span class="val">${data.spNumber || '-'}</span></div>
                <div class="detail-item"><strong>MRP Price:</strong> <span class="val">Rs. ${parseFloat(data.mrp || 0).toLocaleString()}</span></div>
                <div class="detail-item"><strong>Down Payment:</strong> <span class="val">Rs. ${parseFloat(data.downPayment || 0).toLocaleString()}</span></div>
                <div class="detail-item"><strong>Document Charge:</strong> <span class="val">Rs. ${parseFloat(data.document || 0).toLocaleString()}</span></div>
                <div class="detail-item"><strong>Loan Amount:</strong> <span class="val" style="color:var(--success); font-weight:bold;">Rs. ${parseFloat(data.loanAmount || 0).toLocaleString()}</span></div>
                <div class="detail-item"><strong>Settlement Amount:</strong> <span class="val" style="color:var(--warning); font-weight:bold;">Rs. ${parseFloat(data.settlement || 0).toLocaleString()}</span></div>
                <div class="detail-item"><strong>Current Status:</strong> <span class="val">${getStatusBadge(data.status)}</span></div>
            `;
            
            document.getElementById('replyText').value = data.adminReply || '';
            document.getElementById('fintrexPaymentText').value = data.fintrexPayment || '';
            document.getElementById('paymentStatusSelect').value = data.paymentStatus === 'Paid' ? 'Paid' : 'Pending';
            
            const completeBtn = document.getElementById('completeProcessBtn');
            if (data.status === 'Confirmed') {
                completeBtn.style.display = 'block';
            } else {
                completeBtn.style.display = 'none';
            }

            document.getElementById('detailModal').style.display = 'flex';
        };

        window.closeModal = function() {
            document.getElementById('detailModal').style.display = 'none';
            currentModalDocId = null;
        };

        // Save Modal Updates
        document.getElementById('saveUpdatesBtn').addEventListener('click', async () => {
            if (!currentModalDocId) return;
            
            const reply = document.getElementById('replyText').value;
            const fintrex = document.getElementById('fintrexPaymentText').value;
            const pStatus = document.getElementById('paymentStatusSelect').value;
            
            const btn = document.getElementById('saveUpdatesBtn');
            btn.innerText = 'Saving...';
            btn.disabled = true;
            
            try {
                const currentData = allSales.find(s => s.id === currentModalDocId);
                let newMainStatus = currentData ? currentData.status : 'New';
                
                if (newMainStatus !== 'Confirmed' && newMainStatus !== 'Completed') {
                    if (pStatus === 'Paid') {
                        newMainStatus = 'Payment Sent';
                    } else if (reply.trim() !== '') {
                        newMainStatus = 'Admin Replied';
                    }
                }

                await updateDoc(doc(db, "sales", currentModalDocId), { 
                    status: newMainStatus, 
                    adminReply: reply,
                    fintrexPayment: fintrex,
                    paymentStatus: pStatus
                });
                
                showToast("Updates saved successfully!", "success");
                closeModal();
            } catch (e) { 
                console.error("Save error:", e);
                showToast("Error saving updates: " + e.message, "error"); 
            } finally {
                btn.innerText = 'Save Updates';
                btn.disabled = false;
            }
        });

        // Complete Process Action
        document.getElementById('completeProcessBtn').addEventListener('click', async () => {
            if (!currentModalDocId) return;
            const btn = document.getElementById('completeProcessBtn');
            btn.innerText = 'Completing...';
            try {
                await updateDoc(doc(db, "sales", currentModalDocId), { status: 'Completed', paymentStatus: 'Paid' });
                showToast("Process marked as completed!", "success");
                closeModal();
            } catch (e) {
                console.error(e);
                showToast("Error completing process: " + e.message, "error");
            } finally {
                btn.innerText = 'Complete Process ✅';
            }
        });

        // Delete Entry Action
        document.getElementById('deleteEntryBtn').addEventListener('click', async () => {
            if (!currentModalDocId) return;
            if (!confirm("Are you sure you want to delete this submission entry? This action cannot be undone.")) return;

            try {
                await deleteDoc(doc(db, "sales", currentModalDocId));
                showToast("Submission deleted successfully", "warning");
                closeModal();
            } catch (e) {
                console.error("Delete error:", e);
                showToast("Failed to delete entry: " + e.message, "error");
            }
        });

        // ==========================================
        // MAIN SHOP DIRECT PROFIT & SALES MANAGER LOGIC
        // ==========================================
        
        function loadMainShopSalesData() {
            onSnapshot(collection(db, "main_shop_sales"), (snapshot) => {
                allMainShopSales = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    data.id = docSnap.id;
                    allMainShopSales.push(data);
                });

                // Auto update Staff Autocomplete Datalist
                const staffSet = new Set();
                allMainShopSales.forEach(s => { if (s.staffName) staffSet.add(s.staffName.trim()) });
                updateActivatorDatalist(Array.from(staffSet));

                renderMainShopProfitView();
                renderStaffProfiles(); // Re-render staff profiles when data changes
            }, (err) => console.error("Main shop sales fetch error:", err));
        }

        window.calculateMainShopLiveProfit = function() {
            const mrp = parseFloat(document.getElementById('mainSaleMrp').value) || 0;
            const buyPrice = parseFloat(document.getElementById('mainSaleBuyPrice').value) || 0;
            const leasePct = parseFloat(document.getElementById('mainSaleLeasePercent').value) || 2.0;
            const staffFee = parseFloat(document.getElementById('mainSaleStaffFee').value) || 500;

            const leaseFee = mrp * (leasePct / 100);
            document.getElementById('leaseFeeDisplay').innerText = `Leasing Fee (${leasePct}%): Rs. ` + leaseFee.toLocaleString(undefined, {minimumFractionDigits: 2});

            const netProfit = mrp - buyPrice - leaseFee - staffFee;
            const profitEl = document.getElementById('liveNetProfitVal');
            profitEl.innerText = 'Rs. ' + netProfit.toLocaleString(undefined, {minimumFractionDigits: 2});
            if (netProfit < 0) profitEl.style.color = 'var(--danger)';
            else profitEl.style.color = 'var(--success)';
        };

        document.getElementById('mainSaleForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('mainSaleSubmitBtn');
            btn.disabled = true;
            btn.innerText = 'Saving Entry...';

            const mrp = parseFloat(document.getElementById('mainSaleMrp').value) || 0;
            const buyPrice = parseFloat(document.getElementById('mainSaleBuyPrice').value) || 0;
            const leasePct = parseFloat(document.getElementById('mainSaleLeasePercent').value) || 2.0;
            const leaseFee = mrp * (leasePct / 100);
            const staffFee = parseFloat(document.getElementById('mainSaleStaffFee').value) || 500;
            const staffName = document.getElementById('mainSaleStaffName').value.trim();
            const netProfit = mrp - buyPrice - leaseFee - staffFee;

            const payload = {
                date: document.getElementById('mainSaleDate').value,
                spNumber: document.getElementById('mainSaleSp').value.trim(),
                custName: document.getElementById('mainSaleCustName').value.trim(),
                custNic: document.getElementById('mainSaleCustNic').value.trim(),
                imei: document.getElementById('mainSaleImei').value.trim(),
                model: document.getElementById('mainSaleModel').value.trim(),
                mrp: mrp,
                buyPrice: buyPrice,
                leasePercent: leasePct,
                leaseFee: leaseFee,
                staffName: staffName,
                staffFee: staffFee,
                netProfit: netProfit,
                timestamp: Date.now()
            };

            addDoc(collection(db, "main_shop_sales"), payload).then(() => {
                showToast("Main shop sale entry added!", "success");
                saveActivatorStaffName(staffName);
                document.getElementById('mainSaleForm').reset();
                document.getElementById('mainSaleDate').valueAsDate = new Date();
                document.getElementById('mainSaleLeasePercent').value = "2.0";
                document.getElementById('mainSaleStaffFee').value = "500";
                calculateMainShopLiveProfit();
            }).catch(err => {
                showToast("Error adding sale entry: " + err.message, "error");
            }).finally(() => {
                btn.disabled = false;
                btn.innerText = 'Add Main Shop Sale Entry';
            });
        });

        // Activator Staff Auto-Complete
        function saveActivatorStaffName(name) {
            if (!name) return;
            let saved = JSON.parse(localStorage.getItem('activatorStaffNames') || '[]');
            if (!saved.includes(name)) {
                saved.push(name);
                localStorage.setItem('activatorStaffNames', JSON.stringify(saved));
                updateActivatorDatalist(saved);
            }
        }

        function loadActivatorStaffDatalist() {
            let saved = JSON.parse(localStorage.getItem('activatorStaffNames') || '[]');
            updateActivatorDatalist(saved);
        }

        function updateActivatorDatalist(namesArray) {
            const datalist = document.getElementById('activatorDatalist');
            if (!datalist) return;
            const uniqueNames = new Set(namesArray);
            datalist.innerHTML = '';
            uniqueNames.forEach(n => {
                if (n) {
                    const opt = document.createElement('option');
                    opt.value = n;
                    datalist.appendChild(opt);
                }
            });
        }

        // Date Range Filtering for Main Shop
        window.handleMainProfitDateSelection = function(val) {
            if (val === 'custom') {
                document.getElementById('customDateRangeContainer').style.display = 'flex';
            } else {
                document.getElementById('customDateRangeContainer').style.display = 'none';
                filterMainShopByDateRange(val);
            }
        };

        window.filterMainShopByDateRange = function(rangeType) {
            currentProfitRange = rangeType;
            renderMainShopProfitView();
        };

        window.applyCustomDateRange = function() {
            currentProfitRange = 'custom';
            renderMainShopProfitView();
        };

        function renderMainShopProfitView() {
            const tbody = document.getElementById('mainShopTableBody');
            tbody.innerHTML = '';

            const now = new Date();
            const todayStr = now.toISOString().slice(0, 10);
            
            const startOfWeek = new Date(now);
            startOfWeek.setDate(now.getDate() - now.getDay());
            startOfWeek.setHours(0,0,0,0);

            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            const startOf3Months = new Date(now.getFullYear(), now.getMonth() - 3, 1);
            const startOfYear = new Date(now.getFullYear(), 0, 1);

            const customStart = document.getElementById('profitStartDate')?.value || '';
            const customEnd = document.getElementById('profitEndDate')?.value || '';
            const searchInput = (document.getElementById('mainShopSearch')?.value || '').toLowerCase();

            let totalMrp = 0;
            let totalBuyPrice = 0;
            let totalLeaseFees = 0;
            let totalStaffFees = 0;
            let totalNetProfit = 0;

            const filteredSales = allMainShopSales.filter(item => {
                if (!item.date) return true;
                const itemDate = new Date(item.date);
                
                if (currentProfitRange === 'today') {
                    return item.date === todayStr;
                } else if (currentProfitRange === 'week') {
                    return itemDate >= startOfWeek;
                } else if (currentProfitRange === 'month') {
                    return itemDate >= startOfMonth;
                } else if (currentProfitRange === '3months') {
                    return itemDate >= startOf3Months;
                } else if (currentProfitRange === 'year') {
                    return itemDate >= startOfYear;
                } else if (currentProfitRange === 'custom') {
                    if (customStart && item.date < customStart) return false;
                    if (customEnd && item.date > customEnd) return false;
                }
                
                if (searchInput) {
                    const matchSearch = (item.imei || '').toLowerCase().includes(searchInput) ||
                                        (item.custNic || '').toLowerCase().includes(searchInput) ||
                                        (item.spNumber || '').toLowerCase().includes(searchInput) ||
                                        (item.model || '').toLowerCase().includes(searchInput) ||
                                        (item.custName || '').toLowerCase().includes(searchInput);
                    if (!matchSearch) return false;
                }
                
                return true;
            });

            filteredSales.forEach(item => {
                const mrp = parseFloat(item.mrp) || 0;
                const buy = parseFloat(item.buyPrice) || 0;
                const lease = parseFloat(item.leaseFee) || 0;
                const staff = parseFloat(item.staffFee) || 0;
                const net = parseFloat(item.netProfit) || (mrp - buy - lease - staff);

                totalMrp += mrp;
                totalBuyPrice += buy;
                totalLeaseFees += lease;
                totalStaffFees += staff;
                totalNetProfit += net;
            });

            document.getElementById('mainTotalMrp').innerText = 'Rs. ' + totalMrp.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('mainTotalBuyPrice').innerText = 'Rs. ' + totalBuyPrice.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('mainTotalLeasingFees').innerText = 'Rs. ' + totalLeaseFees.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('mainTotalStaffFees').innerText = 'Rs. ' + totalStaffFees.toLocaleString(undefined, {minimumFractionDigits: 2});
            
            const netProfitEl = document.getElementById('mainTotalNetProfit');
            netProfitEl.innerText = 'Rs. ' + totalNetProfit.toLocaleString(undefined, {minimumFractionDigits: 2});
            if (totalNetProfit < 0) netProfitEl.style.color = 'var(--danger)';
            else netProfitEl.style.color = 'var(--success)';

            if (filteredSales.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 2rem;">No sales records for selected time range.</td></tr>';
                return;
            }

            filteredSales.forEach(item => {
                const tr = document.createElement('tr');
                const mrp = parseFloat(item.mrp) || 0;
                const buy = parseFloat(item.buyPrice) || 0;
                const lease = parseFloat(item.leaseFee) || 0;
                const staff = parseFloat(item.staffFee) || 0;
                const net = parseFloat(item.netProfit) || (mrp - buy - lease - staff);

                let profitColor = net >= 0 ? 'var(--success)' : 'var(--danger)';

                tr.innerHTML = `
                    <td><strong>${item.date || '-'}</strong><br><span style="color:var(--text-muted)">${item.spNumber || '-'}</span></td>
                    <td><strong>${item.model || '-'}</strong><br><span style="color:var(--accent-purple)">${item.custName || '-'}</span></td>
                    <td><span class="badge badge-new">${item.staffName || 'Staff'}</span></td>
                    <td>MRP: Rs. ${mrp.toLocaleString()}<br><span style="color:#fca5a5">Cost: Rs. ${buy.toLocaleString()}</span></td>
                    <td>Lease 2%: Rs. ${lease.toLocaleString()}<br>Staff: Rs. ${staff.toLocaleString()}</td>
                    <td><strong style="color:${profitColor}; font-size:1rem;">Rs. ${net.toLocaleString(undefined, {minimumFractionDigits:2})}</strong></td>
                    <td>
                        <button onclick="deleteMainShopSale('${item.id}')" style="background: transparent; border: none; color: #fca5a5; cursor: pointer; padding: 4px;" title="Delete Record">
                            🗑️
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.deleteMainShopSale = async function(id) {
            if (!confirm("Delete this Main Shop direct sale record?")) return;
            try {
                await deleteDoc(doc(db, "main_shop_sales", id));
                showToast("Record deleted", "warning");
            } catch (e) {
                showToast("Failed to delete record: " + e.message, "error");
            }
        };

        // Inventory Logic
        function loadInventoryData() {
            const q = query(collection(db, "inventory"));
            onSnapshot(q, (snapshot) => {
                const tbody = document.getElementById('inventoryTableBody');
                const datalist = document.getElementById('shopDatalist');
                const stockBadge = document.getElementById('stockCountBadge');
                tbody.innerHTML = '';
                
                if (snapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 2rem;">No inventory stock items added yet.</td></tr>';
                    datalist.innerHTML = '';
                    stockBadge.innerText = '0 Items';
                    return;
                }
                
                stockBadge.innerText = `${snapshot.size} Items`;
                const uniqueLocations = new Set();
                
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    const tr = document.createElement('tr');
                    
                    let badge = data.status === 'Available' 
                        ? '<span class="badge badge-confirmed">Available</span>' 
                        : '<span class="badge" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4);">Sold</span>';
                    
                    let location = data.shop || '-';
                    if (data.shop) uniqueLocations.add(data.shop.trim());
                    
                    tr.innerHTML = `
                        <td><strong>${data.imei}</strong></td>
                        <td>${data.model} - ${data.storage}</td>
                        <td><span style="color: var(--accent-purple); font-weight: 500;">${location}</span></td>
                        <td>${badge}</td>
                        <td>
                            <button onclick="openTransferModal('${docId}', '${data.imei}', '${data.model}')" style="background: transparent; border: none; color: var(--info); cursor: pointer; padding: 4px; margin-right: 8px; font-size: 1.1rem;" title="Transfer Stock">
                                🔄
                            </button>
                            <button onclick="deleteInventoryItem('${docId}', '${data.imei}')" style="background: transparent; border: none; color: #fca5a5; cursor: pointer; padding: 4px; font-size: 1.1rem;" title="Remove Stock">
                                🗑️
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                datalist.innerHTML = '';
                uniqueLocations.forEach(loc => {
                    if (loc) {
                        const option = document.createElement('option');
                        option.value = loc;
                        datalist.appendChild(option);
                    }
                });
            }, (err) => {
                console.error("Inventory error:", err);
            });
        }

        window.deleteInventoryItem = async function(id, imei) {
            if (!confirm(`Delete stock item with IMEI ${imei}?`)) return;
            try {
                await deleteDoc(doc(db, "inventory", id));
                showToast(`Inventory item ${imei} deleted`, "warning");
            } catch (e) {
                showToast("Failed to delete stock item: " + e.message, "error");
            }
        };

        document.getElementById('inventoryForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('invSubmitBtn');
            
            const imei = document.getElementById('invImei').value.trim();
            const model = document.getElementById('invModel').value.trim();
            const storage = document.getElementById('invStorage').value.trim();
            const shop = document.getElementById('invShop').value.trim();

            if (!imei || !model || !storage || !shop) return showToast("Please fill all inventory fields", "warning");

            btn.disabled = true;
            btn.innerText = 'Adding Stock...';

            addDoc(collection(db, "inventory"), {
                imei: imei,
                model: model,
                storage: storage,
                shop: shop,
                status: 'Available',
                timestamp: Date.now()
            }).then(() => {
                showToast(`Added ${model} (${imei}) to ${shop}`, "success");
                document.getElementById('invImei').value = '';
                document.getElementById('invImei').focus();
            }).catch(err => {
                console.error("Error adding inventory item:", err);
                showToast("Error adding item: " + err.message, "error");
            }).finally(() => {
                btn.innerText = 'Add to Head Office Inventory';
                btn.disabled = false;
            });
        });

        // Stock Transfer Logic
        let currentTransferDocId = null;
        window.openTransferModal = function(docId, imei, model) {
            currentTransferDocId = docId;
            document.getElementById('transferItemName').innerText = `Item: ${model} (IMEI: ${imei})`;
            document.getElementById('transferShopInput').value = '';
            document.getElementById('transferModal').style.display = 'flex';
        };

        window.closeTransferModal = function() {
            currentTransferDocId = null;
            document.getElementById('transferModal').style.display = 'none';
        };

        const confirmTransferBtn = document.getElementById('confirmTransferBtn');
        if (confirmTransferBtn) {
            confirmTransferBtn.addEventListener('click', async () => {
                const targetShop = document.getElementById('transferShopInput').value.trim();
                if (!targetShop) return showToast("Please enter or select a target shop", "warning");
                if (!currentTransferDocId) return;

                const btn = confirmTransferBtn;
                btn.disabled = true;
                btn.innerText = 'Transferring...';

                try {
                    await updateDoc(doc(db, "inventory", currentTransferDocId), { shop: targetShop });
                    showToast(`Stock transferred to ${targetShop} successfully!`, "success");
                    closeTransferModal();
                } catch (e) {
                    console.error("Transfer error:", e);
                    showToast("Failed to transfer stock: " + e.message, "error");
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'Confirm Transfer';
                }
            });
        }

        // ==========================================
        // STAFF PROFILES & ACTIVATOR PAYMENTS
        // ==========================================

        function renderStaffProfiles() {
            const grid = document.getElementById('staffGrid');
            if (!grid) return;
            
            const staffMap = {};
            
            allMainShopSales.forEach(s => {
                const name = (s.staffName || '').trim();
                if (!name) return;
                
                const lowerName = name.toLowerCase();
                if (!staffMap[lowerName]) {
                    staffMap[lowerName] = {
                        originalName: name,
                        sales: [],
                        totalCount: 0,
                        totalPaid: 0,
                        totalPending: 0
                    };
                }
                
                staffMap[lowerName].sales.push(s);
                staffMap[lowerName].totalCount++;
                
                const fee = parseFloat(s.staffFee) || 0;
                if (s.staffPaymentStatus === 'Paid') {
                    staffMap[lowerName].totalPaid += fee;
                } else {
                    // Treat missing or 'Pending' as pending
                    staffMap[lowerName].totalPending += fee;
                }
            });
            
            const staffArray = Object.values(staffMap).sort((a, b) => b.totalPending - a.totalPending);
            
            grid.innerHTML = '';
            
            if (staffArray.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1;">No activator staff records found yet.</p>';
                return;
            }
            
            staffArray.forEach(staff => {
                const initial = staff.originalName.charAt(0).toUpperCase();
                
                const card = document.createElement('div');
                card.className = 'shop-card';
                card.onclick = () => viewStaffProfile(staff.originalName, staff.sales, staff.totalCount, staff.totalPaid, staff.totalPending);
                
                card.innerHTML = `
                    <div style="display: flex; align-items: center; justify-content: center; gap: 1rem; margin-bottom: 1rem;">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--primary) 0%, #990000 100%); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: bold; color: white;">
                            ${initial}
                        </div>
                        <h3 style="color: var(--text-main); margin: 0; font-size: 1.15rem; text-align: left;">${staff.originalName}</h3>
                    </div>
                    
                    <div style="background: #f3f4f6; border-radius: 8px; padding: 1rem; margin-bottom: 1rem;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span style="color: var(--text-muted); font-size: 0.85rem;">Activations:</span>
                            <span style="color: var(--text-main); font-weight: bold;">${staff.totalCount} Phones</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: var(--text-muted); font-size: 0.85rem;">Pending Fee:</span>
                            <span style="color: var(--warning); font-weight: bold;">Rs. ${staff.totalPending.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
                        </div>
                    </div>
                    
                    <button class="action-btn" style="width: 100%; background: var(--card-bg); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color); color: white;">View Profile Details</button>
                `;
                grid.appendChild(card);
            });
        }

        window.viewStaffProfile = function(name, sales, totalCount, totalPaid, totalPending) {
            document.getElementById('staffModalName').innerText = name;
            document.getElementById('staffModalInitials').innerText = name.charAt(0).toUpperCase();
            
            document.getElementById('staffTotalActivations').innerText = totalCount;
            document.getElementById('staffTotalPaid').innerText = 'Rs. ' + totalPaid.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('staffTotalPending').innerText = 'Rs. ' + totalPending.toLocaleString(undefined, {minimumFractionDigits: 2});
            
            const tbody = document.getElementById('staffHistoryTableBody');
            tbody.innerHTML = '';
            
            // Sort sales by newest first
            const sortedSales = [...sales].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            
            sortedSales.forEach(s => {
                const tr = document.createElement('tr');
                tr.style.cursor = 'pointer';
                tr.title = "Click to view more details";
                tr.onclick = function(e) {
                    if (e.target.tagName === 'BUTTON') return; // Prevent expanding when clicking the action button
                    const detailsRow = this.nextElementSibling;
                    if (detailsRow && detailsRow.classList.contains('staff-details-row')) {
                        if (detailsRow.style.display === 'none') {
                            detailsRow.style.display = 'table-row';
                            this.style.background = 'rgba(255,255,255,0.05)';
                        } else {
                            detailsRow.style.display = 'none';
                            this.style.background = '';
                        }
                    }
                };

                const isPaid = s.staffPaymentStatus === 'Paid';
                const fee = parseFloat(s.staffFee) || 0;
                
                const statusBadge = isPaid 
                    ? '<span class="badge badge-confirmed" style="background:rgba(16,185,129,0.2)">Paid</span>' 
                    : '<span class="badge badge-replied">Pending</span>';
                    
                const actionBtn = isPaid
                    ? `<button disabled style="background: var(--card-bg); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); color: var(--text-muted); border: 1px solid var(--border-color); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: not-allowed; font-size: 0.75rem;">Done</button>`
                    : `<button onclick="markStaffFeePaid('${s.id}')" style="background: var(--success); color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.75rem;">Mark as Paid</button>`;

                tr.innerHTML = `
                    <td>${s.date || '-'}</td>
                    <td><strong>${s.custName || '-'}</strong><br><span style="color:var(--text-muted)">${s.model || '-'}</span></td>
                    <td style="font-weight: 600; color: var(--text-main);">Rs. ${fee.toLocaleString()}</td>
                    <td>${statusBadge}</td>
                    <td>${actionBtn}</td>
                `;
                tbody.appendChild(tr);

                // Expandable Details Row
                const detailsTr = document.createElement('tr');
                detailsTr.className = 'staff-details-row';
                detailsTr.style.display = 'none';
                detailsTr.style.background = 'rgba(0,0,0,0.2)';
                detailsTr.innerHTML = `
                    <td colspan="5" style="padding: 1.5rem; border-bottom: 1px solid var(--border-color);">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; font-size: 0.85rem;">
                            <div>
                                <p style="color: var(--text-muted); margin: 0 0 0.3rem 0;">Customer NIC</p>
                                <p style="color: var(--text-main); margin: 0; font-weight: 500;">${s.custNic || '-'}</p>
                            </div>
                            <div>
                                <p style="color: var(--text-muted); margin: 0 0 0.3rem 0;">Contact Number</p>
                                <p style="color: var(--text-main); margin: 0; font-weight: 500;">${s.contact || '-'}</p>
                            </div>
                            <div>
                                <p style="color: var(--text-muted); margin: 0 0 0.3rem 0;">IMEI Number</p>
                                <p style="color: var(--text-main); margin: 0; font-weight: 500;">${s.imei || '-'}</p>
                            </div>
                            <div>
                                <p style="color: var(--text-muted); margin: 0 0 0.3rem 0;">Storage / RAM</p>
                                <p style="color: var(--text-main); margin: 0; font-weight: 500;">${s.storage || '-'}</p>
                            </div>
                            <div>
                                <p style="color: var(--text-muted); margin: 0 0 0.3rem 0;">Retail Price (MRP)</p>
                                <p style="color: var(--text-main); margin: 0; font-weight: 500;">Rs. ${parseFloat(s.mrp||0).toLocaleString()}</p>
                            </div>
                            <div>
                                <p style="color: var(--text-muted); margin: 0 0 0.3rem 0;">Buy Price</p>
                                <p style="color: var(--text-main); margin: 0; font-weight: 500;">Rs. ${parseFloat(s.buyPrice||0).toLocaleString()}</p>
                            </div>
                        </div>
                    </td>
                `;
                tbody.appendChild(detailsTr);
            });
            
            document.getElementById('staffModal').style.display = 'flex';
        };

        window.closeStaffModal = function() {
            document.getElementById('staffModal').style.display = 'none';
        };

        window.markStaffFeePaid = async function(docId) {
            if(!confirm("Mark this activation fee as paid?")) return;
            try {
                await updateDoc(doc(db, "main_shop_sales", docId), { staffPaymentStatus: 'Paid' });
                showToast("Fee marked as paid successfully!", "success");
                // The onSnapshot will automatically re-render the profiles, 
                // but we also need to close the modal or re-render it. 
                // For simplicity, we close it so they can click again to see the updated view.
                closeStaffModal();
            } catch(e) {
                console.error(e);
                showToast("Failed to update fee status: " + e.message, "error");
            }
        };

        // Barcode Scanner Logic
        let html5QrCode = null;
        let currentScannerInputId = null;

        window.startScanner = function(inputId) {
            currentScannerInputId = inputId;
            document.getElementById('manualScannerInput').value = '';
            document.getElementById('scannerModal').style.display = 'flex';
            
            try {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }
                
                const config = { 
                    fps: 10, 
                    qrbox: { width: 300, height: 60 },
                    formatsToSupport: [ 
                        Html5QrcodeSupportedFormats.CODE_128, 
                        Html5QrcodeSupportedFormats.CODE_39, 
                        Html5QrcodeSupportedFormats.EAN_13, 
                        Html5QrcodeSupportedFormats.EAN_8, 
                        Html5QrcodeSupportedFormats.UPC_A 
                    ]
                };

                html5QrCode.start(
                    { facingMode: "environment" }, 
                    config,
                    (decodedText) => {
                        const inputEl = document.getElementById(inputId);
                        inputEl.value = decodedText;
                        stopScanner();
                        showToast("Barcode scanned: " + decodedText, "success");
                        
                        const event = new Event('input', { bubbles: true });
                        inputEl.dispatchEvent(event);
                    },
                    (errorMessage) => {
                        // scanning - ignore
                    }
                ).catch(err => {
                    console.error("Camera error:", err);
                });
            } catch (err) {
                console.error("Scanner error:", err);
                showToast("Could not access camera scanner", "error");
            }
        };

        window.submitManualScan = function() {
            const val = document.getElementById('manualScannerInput').value.trim();
            if (!val) return;
            const inputEl = document.getElementById(currentScannerInputId);
            if (inputEl) {
                inputEl.value = val;
                const event = new Event('input', { bubbles: true });
                inputEl.dispatchEvent(event);
                showToast("Entered manually: " + val, "success");
            }
            stopScanner();
        };

        window.stopScanner = function() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                }).catch(e => console.error(e));
            }
            document.getElementById('scannerModal').style.display = 'none';
        };

        // Service Worker Registration for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
